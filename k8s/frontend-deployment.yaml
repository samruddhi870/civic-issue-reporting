
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civic-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: civic-frontend
  template:
    metadata:
      labels:
        app: civic-frontend
    spec:
      containers:
        - name: frontend
          image: samruddhi870/civic-issue-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10